<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ULTRAKILL // HERESY-JUDGEMENT</title>
    <style>
        @font-face { font-family: 'VCR OSD Mono'; src: local('VCR OSD Mono'), url('VCR_OSD_MONO.ttf'), url('input_file_0.ttf'); }
        :root { --bg-color: #0b0000; --text-color: #ffffff; --accent-color: #ff3c3c; --gold: #ffcc00; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'VCR OSD Mono', monospace; margin:0; overflow:hidden; }
        #viewport { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        .interactive-grid { position: relative; flex-grow: 1; background: radial-gradient(circle, #250000 0%, #050000 100%); }
        .click-object { position: absolute; background: #220000; border: 2px solid var(--accent-color); color: #fff; padding: 12px 24px; cursor: pointer; font-family: inherit; font-size: 1.1em; }
        .click-object:hover { background: var(--accent-color); color: #000; font-weight: bold; box-shadow: 0 0 20px #ff3c3c; }
        .boss-sprite { position: absolute; top: 10%; left: 38%; text-align: center; color: var(--gold); }
        .terminal-display { background: #000; border-top: 3px solid var(--accent-color); padding: 15px; height: 140px; font-size: 1.1em; }
        .hud { display: flex; justify-content: space-between; background: #000; padding: 10px 20px; border-bottom: 2px solid var(--accent-color); font-size: 1.2em;}
    </style>
</head>
<body>
<div id="viewport">
    <div class="hud">
        <div style="color:var(--accent-color)">ХИТЫ БОССА: <span id="boss-hp">3</span>/3</div>
        <div style="color:var(--gold)">СТИЛЬ V1: <span id="style-points">0</span></div>
    </div>

    <div class="interactive-grid" id="arena">
        <div class="boss-sprite">
            <h2>ГАВРИИЛ // СУДЬЯ АДА</h2>
            <pre style="font-size: 1.1em; line-height: 1;">
     _/\_
    ( O.O )
    --|-|--
     /               </pre>
        </div>

        <button id="hit-btn" class="click-object" style="top: 65%; left: 40%;" onclick="hitGabriel()">[ ⚔️ СБИТЬ БОЖЕСТВЕННЫЙ ЩИТ ]</button>
    </div>

    <div class="terminal-display" id="battle-log">
        «МАШИНА. Мои руки обагрены кровью праведников, и я признаю: ты превосходишь моих слуг. НО НЕ МЕНЯ!»
        Гавриил атакует световыми мечами! Кликайте по кнопке удара, отслеживая её хаотичные перемещения по арене!
    </div>
</div>

<script>
    let bossHp = 3;
    let style = 0;

    function hitGabriel() {
        bossHp--;
        style += 120;
        document.getElementById('boss-hp').innerText = bossHp;
        document.getElementById('style-points').innerText = style;

        if (bossHp <= 0) {
            document.getElementById('hit-btn').style.display = 'none';
            document.getElementById('battle-log').innerHTML = `
                <span style="color:var(--gold)">[МИССИЯ ВЫПОЛНЕНА // ВЫСШИЙ РАНГ: ULTRAKILL]</span><br>
                Гавриил харкает святой кровью на плиты Ереси: «Как... Какая-то груда ржавого металла одолела Волю Божью?!»<br>
                Ангел исчезает во вспышке света. Вы зачистили этот сектор. Терминал завершает симуляцию.<br>
                <button onclick="restartGame()" style="margin-top:10px; background:#000; color:#fff; border:1px solid #fff; padding:5px 10px; cursor:pointer;">Вернуться на Вход</button>
            `;
        } else {
            document.getElementById('battle-log').innerText = `Прямое попадание! Гавриил телепортируется в ярости: «ТЫ ЛИШЬ НИЧТОЖЕСТВО!»`;
            moveButton();
        }
    }

    function moveButton() {
        const btn = document.getElementById('hit-btn');
        const randomTop = Math.floor(Math.random() * 50 + 40) + "%";
        const randomLeft = Math.floor(Math.random() * 70 + 10) + "%";
        btn.style.top = randomTop;
        btn.style.left = randomLeft;
    }

    function restartGame() {
        localStorage.clear();
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
